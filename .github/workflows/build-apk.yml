name: Build PartyChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android .
      
      - name: Create debug keystore
        run: |
          mkdir -p ~/.config/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      
      - name: Get SHA-1
        working-directory: android
        run: ./gradlew signingReport
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartyChat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
